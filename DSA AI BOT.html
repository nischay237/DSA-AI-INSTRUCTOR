<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Instructor AI</title>
    <!-- Font Awesome for modern icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #07080d;
            --bg-card: rgba(15, 17, 26, 0.7);
            --bg-input: #151824;
            --bg-bubble-bot: #151824;
            --bg-bubble-user: linear-gradient(135deg, #6366f1, #4f46e5);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #6366f1; /* Premium Indigo */
            --accent-secondary: #06b6d4; /* Neon Cyan */
            --border-color: rgba(255, 255, 255, 0.04);
            --border-glow: rgba(99, 102, 241, 0.15);
            --glow-color: rgba(99, 102, 241, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            padding: 16px;
        }

        /* Container Layout with subtle backdrop radial gradient */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 16px;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* 1. Left Sidebar */
        .sidebar {
            width: 20%;
            background-color: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            font-weight: 800;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1.15rem;
            box-shadow: 0 4px 20px var(--border-glow);
            letter-spacing: -0.5px;
        }

        .logo-text h2 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .logo-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid transparent;
            background: none;
            text-align: left;
            font-size: 0.92rem;
        }

        .menu-item i {
            font-size: 1.1rem;
        }

        .menu-item:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .menu-item.active {
            color: var(--text-main);
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0.02) 100%);
            border-left: 3px solid var(--accent-primary);
            border-radius: 0 10px 10px 0;
            padding-left: 15px;
        }

        /* 2. Center Section (Chat Panel) */
        .center-section {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }

        /* Metric Box with futuristic stats bar */
        .metric-card {
            background-color: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .metric-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
        }

        .metric-icon {
            color: var(--accent-primary);
            font-size: 1.9rem;
            filter: drop-shadow(0 0 8px var(--border-glow));
        }

        .metric-info h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text; /* Compatibility fix */
            -webkit-text-fill-color: transparent;
        }

        .metric-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Chat Container Layout */
        .chat-container {
            flex-grow: 1;
            background-color: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
        }

        .messages-area {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Scrollbar styling */
        .messages-area::-webkit-scrollbar, .tab-content-scroll::-webkit-scrollbar {
            width: 5px;
        }
